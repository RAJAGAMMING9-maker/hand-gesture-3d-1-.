<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand Gesture 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#050611;color:white;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%}header{position:fixed;top:12px;left:0;right:0;text-align:center;z-index:2;text-shadow:0 2px 10px #000}
h1{font-size:clamp(20px,5vw,30px);margin:8px}#status{font-size:14px;color:#c9d4ff}
#start{position:fixed;z-index:4;left:50%;top:52%;transform:translate(-50%,-50%);padding:14px 20px;border:0;border-radius:14px;background:#a9e5ff;color:#07101d;font-weight:bold;font-size:16px}
#cam{position:fixed;z-index:2;right:12px;bottom:12px;width:min(30vw,150px);border-radius:12px;transform:scaleX(-1);border:1px solid #ffffff55;background:#111}
#hint{position:fixed;z-index:2;left:12px;bottom:16px;max-width:62vw;padding:10px 12px;border:1px solid #ffffff22;border-radius:12px;background:#101426cc;font-size:12px;line-height:1.5}
#label{font-weight:bold;font-size:15px}.hidden{display:none}
</style></head><body>
<canvas id="scene"></canvas>
<header><h1>HAND GESTURE 3D</h1><div id="status">Tekan tombol untuk mengaktifkan kamera</div></header>
<button id="start">📷 Aktifkan Kamera</button><video id="cam" autoplay playsinline muted class="hidden"></video>
<div id="hint"><div id="label">Menunggu gestur…</div>☝️ Telunjuk = Saturnus<br>✌️ Dua jari = I LOVE YOU<br>✊ Mengepal = hati 3D</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
(()=> {
const canvas=document.querySelector('#scene'), video=document.querySelector('#cam'), btn=document.querySelector('#start'), status=document.querySelector('#status'), label=document.querySelector('#label');
if(!window.THREE||!window.Hands){status.textContent='Library gagal dimuat. Periksa internet lalu muat ulang.';return}
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x050611);
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.z=9;
scene.add(new THREE.AmbientLight(0xffffff,1.3));const light=new THREE.PointLight(0xb5d8ff,90);light.position.set(4,4,6);scene.add(light);
const starsGeo=new THREE.BufferGeometry(),positions=[];for(let i=0;i<450;i++)positions.push((Math.random()-.5)*35,(Math.random()-.5)*22,-Math.random()*22);
starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xbacbff,size:.035}));scene.add(stars);
const root=new THREE.Group();scene.add(root);
const saturn=new THREE.Group();root.add(saturn);
saturn.add(new THREE.Mesh(new THREE.SphereGeometry(1.05,64,48),new THREE.MeshStandardMaterial({color:0xd6ad73,roughness:.82})));
const ring=new THREE.Mesh(new THREE.RingGeometry(1.3,2.05,128),new THREE.MeshStandardMaterial({color:0xe5cfaa,side:THREE.DoubleSide,roughness:.8}));ring.rotation.x=Math.PI/2.45;ring.rotation.y=.12;saturn.add(ring);
const ring2=new THREE.Mesh(new THREE.RingGeometry(1.12,1.28,128),new THREE.MeshStandardMaterial({color:0xb68b5b,side:THREE.DoubleSide}));ring2.rotation.copy(ring.rotation);saturn.add(ring2);
const heart=new THREE.Group();root.add(heart);const shape=new THREE.Shape();shape.moveTo(0,-.65);shape.bezierCurveTo(-.15,-.35,-1.25,.35,-1.15,1);shape.bezierCurveTo(-1.08,1.75,-.15,1.65,0,1.05);shape.bezierCurveTo(.15,1.65,1.08,1.75,1.15,1);shape.bezierCurveTo(1.25,.35,.15,-.35,0,-.65);
const hg=new THREE.ExtrudeGeometry(shape,{depth:.42,bevelEnabled:true,bevelSegments:5,steps:1,bevelSize:.12,bevelThickness:.12,curveSegments:20});hg.center();heart.add(new THREE.Mesh(hg,new THREE.MeshPhysicalMaterial({color:0xff174d,roughness:.22,metalness:.12,clearcoat:1})));
const tc=document.createElement('canvas');tc.width=1024;tc.height=256;const ctx=tc.getContext('2d');ctx.font='bold 112px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#ff225e';ctx.shadowBlur=28;ctx.fillStyle='#fff';ctx.fillText('I LOVE YOU ♥',512,128);
const love=new THREE.Mesh(new THREE.PlaneGeometry(5.6,1.4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(tc),transparent:true,side:THREE.DoubleSide,depthWrite:false}));root.add(love);
function show(m){saturn.visible=m==='saturn';love.visible=m==='love';heart.visible=m==='heart';label.textContent=m==='saturn'?'🪐 SATURNUS 3D':m==='love'?'💗 I LOVE YOU':m==='heart'?'❤️ HATI 3D':'Menunggu gestur tangan…'}
show('none');
function raised(lm,tip,pip){return Math.hypot(lm[tip].x-lm[0].x,lm[tip].y-lm[0].y)>Math.hypot(lm[pip].x-lm[0].x,lm[pip].y-lm[0].y)*1.12}
function detect(lm){let a=raised(lm,8,6),b=raised(lm,12,10),c=raised(lm,16,14),d=raised(lm,20,18);if(a&&!b&&!c&&!d)return'saturn';if(a&&b&&!c&&!d)return'love';if(!a&&!b&&!c&&!d)return'heart';return'none'}
let current='none',last='none',stable=0,processing=false;
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});
hands.onResults(r=>{processing=false;const lm=r.multiHandLandmarks&&r.multiHandLandmarks[0];if(!lm){status.textContent='Tangan belum terdeteksi — arahkan telapak ke kamera.';return}const m=detect(lm);if(m===last)stable++;else{last=m;stable=0}if(stable>=3&&m!==current){current=m;show(m)}status.textContent='Kamera aktif • Gestur: '+m});
async function loop(){if(video.readyState>=2&&!processing){processing=true;try{await hands.send({image:video})}catch(e){processing=false}}requestAnimationFrame(loop)}
btn.onclick=async()=>{btn.disabled=true;status.textContent='Meminta izin kamera…';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Gunakan browser modern melalui hosting HTTPS.');const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();video.classList.remove('hidden');btn.classList.add('hidden');status.textContent='Kamera aktif. Tunjukkan gestur tangan.';loop()}catch(e){btn.disabled=false;status.textContent=e.name==='NotAllowedError'?'Izin kamera ditolak. Izinkan kamera pada pengaturan situs, lalu muat ulang.':'Kamera gagal: '+(e.message||e.name)}};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();saturn.rotation.y+=.004;ring.rotation.z=Math.sin(t*.35)*.06;heart.rotation.y=Math.sin(t*.8)*.22;heart.rotation.x=Math.sin(t*.6)*.1;heart.position.y=Math.sin(t*1.5)*.12;love.position.y=Math.sin(t*1.2)*.08;stars.rotation.y=t*.006;renderer.render(scene,camera)}animate();
})();
</script></body></html>
